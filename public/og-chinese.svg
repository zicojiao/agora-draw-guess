  <text x="92" y="470" fill="#68717b" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, sans-serif" font-size="20" font-weight="700">桃子 · 西瓜 · 苹果 · 星星 · 太阳</text>
  <text x="92" y="506" fill="#68717b" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, sans-serif" font-size="20" font-weight="700">灯泡 · 吉他 · 帆船 · 桥</text>

