  <circle cx="1090" cy="70" r="150" fill="#ffd84d" opacity=".7"/>
  <rect x="64" y="64" width="1072" height="506" rx="36" fill="#ffd84d"/>
  <rect x="48" y="48" width="1072" height="506" rx="36" fill="#ffffff" stroke="#171a1f" stroke-width="7"/>

  <text x="92" y="148" fill="#68717b" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, sans-serif" font-size="24" font-weight="700" letter-spacing="5">灵感碰杯</text>
  <text x="92" y="248" fill="#171a1f" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, sans-serif" font-size="84" font-weight="900">你画AI猜</text>
  <text x="92" y="322" fill="#075985" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, sans-serif" font-size="32" font-weight="800">朋友一起画，AI 一起猜。</text>
